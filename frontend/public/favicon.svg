<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0D2B1F"/>

  <!-- Left pill (Letter I + D shape) -->
  <rect x="10" y="24" width="26" height="16" rx="8" stroke="#00C896" stroke-width="3.5" fill="none"/>

  <!-- Inner cutout to make it look open on the right (C shape) -->
  <rect x="28" y="27.5" width="12" height="9" fill="#0D2B1F"/>

  <!-- Right dot (brain/dot element) -->
  <circle cx="50" cy="32" r="5.5" stroke="#00C896" stroke-width="3.5" fill="none"/>
</svg>
